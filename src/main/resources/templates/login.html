<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accedi · Alice's Simple Mind Maps</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-shell" aria-labelledby="login-title">
    <section class="login-card" aria-label="Modulo di accesso">
        <p class="section-kicker">Alice's Simple Mind Maps</p>
        <button type="button" class="login-card-bunny" aria-label="Fai fare una capriola al coniglietto">🐇</button>
        <div class="login-card-header">
            <p>Inserisci le credenziali per ritrovare le tue mappe mentali.</p>
        </div>

        <div th:if="${param.error}" class="login-alert login-alert-error" role="alert">
            Username o password non corretti. Riprova con calma.
        </div>
        <div th:if="${param.rate_limited}" class="login-alert login-alert-error" role="alert">
            Troppi tentativi non riusciti. Attendi 15 minuti prima di riprovare.
        </div>
        <div th:if="${param.logout}" class="login-alert login-alert-ok" role="status">
            Sei uscito correttamente. A presto!
        </div>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="login-field">
                <label for="username">Username</label>
                <div class="login-input-wrap">
                    <span aria-hidden="true">👤</span>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="il-tuo-username" required>
                </div>
            </div>
            <div class="login-field">
                <label for="password">Password</label>
                <div class="login-input-wrap">
                    <span aria-hidden="true">🗝️</span>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="login-submit">Accedi</button>
        </form>
    </section>
</main>
<script>
    const bunnyButton = document.querySelector('.login-card-bunny');

    if (bunnyButton) {
        bunnyButton.addEventListener('click', () => {
            bunnyButton.classList.remove('is-somersaulting');
            void bunnyButton.offsetWidth;
            bunnyButton.classList.add('is-somersaulting');
        });

        bunnyButton.addEventListener('animationend', (event) => {
            if (event.animationName === 'bunny-somersault') {
                bunnyButton.classList.remove('is-somersaulting');
            }
        });
    }
</script>
</body>
</html>
