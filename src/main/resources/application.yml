spring:
  datasource:
    url: jdbc:sqlite:./data/mindmaps.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
server:
  port: 9080
app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6-luna}
  security:
    initial-user:
      username: ${INITIAL_USER_LOGIN:}
      password: ${INITIAL_USER_PASSWORD:}
ai:
  embedding:
    model-url: ${AI_EMBEDDING_MODEL_URL:djl://ai.djl.huggingface.pytorch/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  generation:
    max-attachment-chars: ${AI_GENERATION_MAX_ATTACHMENT_CHARS:60000}
    max-attempts: ${AI_GENERATION_MAX_ATTEMPTS:2}
wikimedia:
  user-agent: ${WIKIMEDIA_USER_AGENT:AliceSimpleMindMap/1.0 (+https://github.com/saidone/simple-mindmap; mailto:bot-traffic@wikimedia.org)}
