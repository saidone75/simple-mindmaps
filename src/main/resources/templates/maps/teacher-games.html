<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le nostre avventure — Giochi delle immagini</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/map-game.css}">
</head>
<body class="playful-game">
<main class="game-page">
    <header class="game-hero">
        <div class="game-hero-copy">
            <span class="game-eyebrow">✦ LE NOSTRE AVVENTURE</span>
            <h1>Oggi a cosa giochiamo?</h1>
            <p>Scegli una mappa e parti alla scoperta delle immagini!</p>
        </div>
        <div class="game-hero-art" aria-hidden="true"><span class="game-mascot">🐰</span></div>
    </header>
    <nav class="teacher-games" aria-label="Scegli un gioco" th:if="${!games.isEmpty()}">
        <a class="teacher-game" th:each="game : ${games}" th:href="@{/play/{token}(token=${game.token},start=true)}">
            <span class="teacher-game-icon" aria-hidden="true">
                <img th:if="${game.imageUri != null}" th:src="${game.imageUri}" alt="" loading="lazy" decoding="async">
                <span class="teacher-game-fallback" th:hidden="${game.imageUri != null}">🧩</span>
            </span>
            <span class="teacher-game-title" th:text="${game.title}">La nostra mappa</span>
            <span class="teacher-game-action" aria-hidden="true">Giochiamo! →</span>
        </a>
    </nav>
    <section class="game-welcome" th:if="${games.isEmpty()}" aria-label="Giochi in preparazione">
        <span aria-hidden="true">🎒</span>
        <h2>Le avventure stanno arrivando!</h2>
        <p>La maestra sta preparando i giochi. Torna presto a esplorare!</p>
    </section>
</main>
<script th:src="@{/js/teacher-games.js}"></script>
</body>
</html>
